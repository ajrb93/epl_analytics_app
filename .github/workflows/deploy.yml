name: Deploy to HF Spaces
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Push to HF
        run: git push https://ajrb93:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/ajrb93/epl_analytics_app main --force